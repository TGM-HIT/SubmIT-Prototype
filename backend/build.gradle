plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ac.at.tgm.submit'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.0.0'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('checkstyleMain', JavaExec) {
    group = 'verification'
    description = 'Runs the repository Checkstyle configuration against production code.'
    classpath = configurations.detachedConfiguration(
        dependencies.create('com.puppycrawl.tools:checkstyle:10.21.2')
    )
    mainClass = 'com.puppycrawl.tools.checkstyle.Main'
    args '-c', '../checkstyle.xml', 'src/main/java'
}

tasks.register('generateOpenApi') {
    group = 'documentation'
    description = 'Generates the OpenAPI document from the running application annotations.'
    dependsOn tasks.named('bootJar')
    doLast {
        int port = 19000 + new Random().nextInt(1000)
        File logFile = layout.buildDirectory.file('openapi-server.log').get().asFile
        File outputFile = file('../contracts/openapi.yaml')
        String javaExecutable = new File(System.getProperty('java.home'), 'bin/java').absolutePath
        String bootJarPath = tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath
        Process process = new ProcessBuilder(javaExecutable, '-jar', bootJarPath,
                "--server.port=${port}", '--spring.main.banner-mode=off')
                .redirectErrorStream(true).redirectOutput(logFile).start()
        boolean generated = false
        long deadline = System.nanoTime() + 60_000_000_000L
        try {
            while (!generated && System.nanoTime() < deadline) {
                try {
                    URLConnection connection = new URL("http://127.0.0.1:${port}/v3/api-docs.yaml").openConnection()
                    connection.connectTimeout = 1000
                    connection.readTimeout = 3000
                    outputFile.setText(connection.inputStream.getText('UTF-8'), 'UTF-8')
                    generated = true
                } catch (Exception ignored) {
                    if (!process.isAlive()) {
                        throw new GradleException("Application exited before OpenAPI export:\n${logFile.text}")
                    }
                    Thread.sleep(500)
                }
            }
        } finally {
            process.destroyForcibly()
        }
        if (!generated) {
            throw new GradleException("Timed out waiting for OpenAPI export:\n${logFile.text}")
        }
        logger.lifecycle("Generated ${outputFile}")
    }
}

tasks.register('verifyBootJarPackaging') {
    group = 'verification'
    description = 'Verifies the executable archive uses the renamed SubmIT entry point.'
    dependsOn tasks.named('bootJar')
    doLast {
        File archive = tasks.named('bootJar').get().archiveFile.get().asFile
        String applicationEntry = 'BOOT-INF/classes/ac/at/tgm/submit/SubmITlication.class'
        def verifyEntries = { List<String> entries, String startClass ->
            if (startClass != 'ac.at.tgm.submit.SubmITlication') {
                throw new GradleException("Unexpected executable archive Start-Class: ${startClass}")
            }
            if (entries.count { it == applicationEntry } != 1) {
                throw new GradleException("Expected exactly one ${applicationEntry} archive entry")
            }
            List<String> foreignClasses = entries.findAll {
                it.startsWith('BOOT-INF/classes/') && it.endsWith('.class')
                        && !it.startsWith('BOOT-INF/classes/ac/at/tgm/submit/')
            }
            if (!foreignClasses.isEmpty()) {
                throw new GradleException("Application classes outside ac.at.tgm.submit namespace: ${foreignClasses}")
            }
        }

        java.util.jar.JarFile jar = new java.util.jar.JarFile(archive)
        try {
            verifyEntries(Collections.list(jar.entries()).collect { it.name },
                    jar.manifest.mainAttributes.getValue('Start-Class'))
        } finally {
            jar.close()
        }

        File testDirectory = layout.buildDirectory.dir('tmp').get().asFile
        testDirectory.mkdirs()
        File testArchive = File.createTempFile('bootjar-foreign-namespace-', '.jar', testDirectory)
        try {
            java.util.jar.Manifest manifest = new java.util.jar.Manifest()
            manifest.mainAttributes.putValue('Manifest-Version', '1.0')
            manifest.mainAttributes.putValue('Start-Class', 'ac.at.tgm.submit.SubmITlication')
            new java.util.jar.JarOutputStream(new FileOutputStream(testArchive), manifest).withCloseable { output ->
                [applicationEntry, 'BOOT-INF/classes/org/example/Foreign.class'].each { name ->
                    output.putNextEntry(new java.util.jar.JarEntry(name))
                    output.write(0)
                    output.closeEntry()
                }
            }
            java.util.jar.JarFile injected = new java.util.jar.JarFile(testArchive)
            try {
                boolean rejected = false
                try {
                    verifyEntries(Collections.list(injected.entries()).collect { it.name },
                            injected.manifest.mainAttributes.getValue('Start-Class'))
                } catch (GradleException expected) {
                    rejected = true
                }
                if (!rejected) {
                    throw new GradleException('Packaging verification accepted an injected foreign-namespace class')
                }
            } finally {
                injected.close()
            }
        } finally {
            testArchive.delete()
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyBootJarPackaging')
}