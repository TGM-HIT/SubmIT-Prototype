plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ac.at.tgm.submit'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal'])
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.0.0'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('verifyDeprecationEnforcement') {
    group = 'verification'
    description = 'Verifies Java production and test compilation reject deprecated API use.'
    doLast {
        javax.tools.JavaCompiler compiler = javax.tools.ToolProvider.systemJavaCompiler
        if (compiler == null) {
            throw new GradleException('A full JDK is required to verify Java deprecation enforcement.')
        }

        File fixtureRoot = layout.buildDirectory.dir('tmp/dev33-deprecation-enforcement').get().asFile
        delete(fixtureRoot)
        File apiSource = new File(fixtureRoot, 'api/ac/at/tgm/submit/dev33/DeprecationFixtureApi.java')
        File productionSource = new File(fixtureRoot, 'production/ac/at/tgm/submit/dev33/ProductionFixtureUse.java')
        File testSource = new File(fixtureRoot, 'test/ac/at/tgm/submit/dev33/TestFixtureUse.java')
        apiSource.parentFile.mkdirs()
        productionSource.parentFile.mkdirs()
        testSource.parentFile.mkdirs()
        apiSource.text = '''package ac.at.tgm.submit.dev33;
public final class DeprecationFixtureApi {
    private DeprecationFixtureApi() {}
    @Deprecated public static void deprecatedCall() {}
    @Deprecated(forRemoval = true) public static void removeMe() {}
    public static void supported() {}
}
'''
        productionSource.text = '''package ac.at.tgm.submit.dev33;
final class ProductionFixtureUse {
    void verify() {
        DeprecationFixtureApi.deprecatedCall();
        DeprecationFixtureApi.removeMe();
        DeprecationFixtureApi.supported();
    }
}
'''
        testSource.text = '''package ac.at.tgm.submit.dev33;
final class TestFixtureUse {
    void verify() {
        DeprecationFixtureApi.deprecatedCall();
        DeprecationFixtureApi.removeMe();
        DeprecationFixtureApi.supported();
    }
}
'''

        def runCompilation = { String sourceSet, List<File> sources, List<String> compilerArgs,
                               File outputDirectory, String classpath ->
            outputDirectory.mkdirs()
            javax.tools.DiagnosticCollector<javax.tools.JavaFileObject> diagnostics =
                    new javax.tools.DiagnosticCollector<>()
            javax.tools.StandardJavaFileManager fileManager =
                    compiler.getStandardFileManager(diagnostics, java.util.Locale.ROOT, java.nio.charset.StandardCharsets.UTF_8)
            boolean succeeded
            try {
                List<String> arguments = new ArrayList<>(compilerArgs)
                arguments.addAll(['-d', outputDirectory.absolutePath])
                if (classpath != null) {
                    arguments.addAll(['-classpath', classpath])
                }
                def units = fileManager.getJavaFileObjectsFromFiles(sources)
                succeeded = compiler.getTask(null, fileManager, diagnostics, arguments, null, units).call()
            } finally {
                fileManager.close()
            }
            [succeeded: succeeded, diagnostics: diagnostics.diagnostics, sourceSet: sourceSet]
        }

        def deprecatedDiagnostics = { result ->
            result.diagnostics.findAll {
                (it.kind == javax.tools.Diagnostic.Kind.WARNING
                        || it.kind == javax.tools.Diagnostic.Kind.MANDATORY_WARNING)
                        && (it.code.toLowerCase().contains('deprecated')
                        || it.code.toLowerCase().contains('removal'))
            }
        }
        def enforceNoDeprecatedUsage = { result ->
            def findings = deprecatedDiagnostics(result)
            if (!findings.isEmpty()) {
                def details = findings.collect {
                    "${it.source?.name}:${it.lineNumber}: ${it.getMessage(java.util.Locale.ROOT)}"
                }.join(System.lineSeparator())
                throw new GradleException("${result.sourceSet} uses deprecated APIs:${System.lineSeparator()}${details}")
            }
        }
        def assertDeprecatedUsesRejected = { result, String sourceName ->
            def inFixture = result.diagnostics.findAll {
                it.source != null && it.source.name.endsWith(sourceName)
            }
            def messages = inFixture.collect { it.getMessage(java.util.Locale.ROOT) }
            def deprecated = deprecatedDiagnostics(result).findAll {
                it.source != null && it.source.name.endsWith(sourceName)
            }
            if (!result.succeeded
                    || !messages.any { it.contains('deprecatedCall') }
                    || !messages.any { it.contains('removeMe') && it.toLowerCase().contains('removal') }
                    || messages.any { it.contains('supported()') }
                    || deprecated.size() < 2) {
                throw new GradleException(
                        "${result.sourceSet} deprecation fixture did not produce expected detailed warnings: ${messages}")
            }
            try {
                enforceNoDeprecatedUsage(result)
                throw new GradleException("${result.sourceSet} deprecation fixture was not rejected by policy.")
            } catch (GradleException expected) {
                if (!expected.message.contains('deprecatedCall')
                        || !expected.message.contains('removeMe')) {
                    throw expected
                }
            }
            logger.lifecycle("Verified ${result.sourceSet} rejects deprecatedCall and removal-marked removeMe at ${sourceName}.")
        }

        List<String> productionArgs = tasks.named('compileJava', JavaCompile).get().options.compilerArgs
        List<String> testArgs = tasks.named('compileTestJava', JavaCompile).get().options.compilerArgs
        File productionOutput = new File(fixtureRoot, 'production-classes')
        def productionResult = runCompilation('compileJava', [apiSource, productionSource],
                productionArgs, productionOutput, null)
        assertDeprecatedUsesRejected(productionResult, 'ProductionFixtureUse.java')

        File apiOutput = new File(fixtureRoot, 'api-classes')
        def apiResult = runCompilation('compileJava supported fixture', [apiSource], productionArgs, apiOutput, null)
        if (!apiResult.succeeded || !apiResult.diagnostics.isEmpty()) {
            throw new GradleException("Non-deprecated Java fixture did not compile cleanly: ${apiResult.diagnostics}")
        }
        File testOutput = new File(fixtureRoot, 'test-classes')
        def testResult = runCompilation('compileTestJava', [testSource], testArgs, testOutput, apiOutput.absolutePath)
        assertDeprecatedUsesRejected(testResult, 'TestFixtureUse.java')

        File unrelatedWarningSource = new File(fixtureRoot, 'unrelated/UnrelatedWarningUse.java')
        unrelatedWarningSource.parentFile.mkdirs()
        unrelatedWarningSource.text = '''import java.util.List;
final class UnrelatedWarningUse {
    List<String> values = (List) List.of("value");
}
'''
        [compileJava: productionArgs, compileTestJava: testArgs].each { sourceSet, compilerArgs ->
            File unrelatedOutput = new File(fixtureRoot, "${sourceSet}-unrelated-classes")
            def unrelatedResult = runCompilation("${sourceSet} unrelated warning fixture", [unrelatedWarningSource],
                    compilerArgs + ['-Xlint:unchecked'], unrelatedOutput, null)
            def unrelatedWarnings = unrelatedResult.diagnostics.findAll {
                (it.kind == javax.tools.Diagnostic.Kind.WARNING
                        || it.kind == javax.tools.Diagnostic.Kind.MANDATORY_WARNING)
                        && it.getMessage(java.util.Locale.ROOT).contains('unchecked')
            }
            if (!unrelatedResult.succeeded || unrelatedWarnings.isEmpty()
                    || !deprecatedDiagnostics(unrelatedResult).isEmpty()) {
                throw new GradleException(
                        "${sourceSet} unrelated unchecked-warning fixture became fatal or was not diagnosed: " +
                                "success=${unrelatedResult.succeeded}, diagnostics=${unrelatedResult.diagnostics}")
            }
            enforceNoDeprecatedUsage(unrelatedResult)
            logger.lifecycle("Verified ${sourceSet} reports an unrelated unchecked warning without failing compilation or deprecation policy.")
        }

        def verifySourceSet = { String sourceSetName, Set<File> sources, List<String> compilerArgs,
                                String classpath ->
            if (sources.isEmpty()) {
                throw new GradleException("${sourceSetName} has no Java sources to verify.")
            }
            File output = new File(fixtureRoot, "${sourceSetName}-verification-classes")
            def result = runCompilation(sourceSetName, sources.toList(), compilerArgs, output, classpath)
            if (!result.succeeded) {
                throw new GradleException("${sourceSetName} verification compilation failed: ${result.diagnostics}")
            }
            enforceNoDeprecatedUsage(result)
            logger.lifecycle("Verified ${sourceSetName} source set has no deprecated/removal diagnostics (${sources.size()} Java files).")
        }

        verifySourceSet('main', sourceSets.main.allJava.files,
                productionArgs, sourceSets.main.compileClasspath.asPath)
        verifySourceSet('test', sourceSets.test.allJava.files,
                testArgs, sourceSets.test.compileClasspath.asPath)
    }
}

tasks.register('checkstyleMain', JavaExec) {
    group = 'verification'
    description = 'Runs the repository Checkstyle configuration against production code.'
    classpath = configurations.detachedConfiguration(
        dependencies.create('com.puppycrawl.tools:checkstyle:10.21.2')
    )
    mainClass = 'com.puppycrawl.tools.checkstyle.Main'
    args '-c', '../checkstyle.xml', 'src/main/java'
}

tasks.register('generateOpenApi') {
    group = 'documentation'
    description = 'Generates the OpenAPI document from the running application annotations.'
    dependsOn tasks.named('bootJar')
    doLast {
        int port = 19000 + new Random().nextInt(1000)
        File logFile = layout.buildDirectory.file('openapi-server.log').get().asFile
        File outputFile = file('../contracts/openapi.yaml')
        String javaExecutable = new File(System.getProperty('java.home'), 'bin/java').absolutePath
        String bootJarPath = tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath
        Process process = new ProcessBuilder(javaExecutable, '-jar', bootJarPath,
                "--server.port=${port}", '--spring.main.banner-mode=off')
                .redirectErrorStream(true).redirectOutput(logFile).start()
        boolean generated = false
        long deadline = System.nanoTime() + 60_000_000_000L
        try {
            while (!generated && System.nanoTime() < deadline) {
                try {
                    URLConnection connection = new URL("http://127.0.0.1:${port}/v3/api-docs.yaml").openConnection()
                    connection.connectTimeout = 1000
                    connection.readTimeout = 3000
                    outputFile.setText(connection.inputStream.getText('UTF-8'), 'UTF-8')
                    generated = true
                } catch (Exception ignored) {
                    if (!process.isAlive()) {
                        throw new GradleException("Application exited before OpenAPI export:\n${logFile.text}")
                    }
                    Thread.sleep(500)
                }
            }
        } finally {
            process.destroyForcibly()
        }
        if (!generated) {
            throw new GradleException("Timed out waiting for OpenAPI export:\n${logFile.text}")
        }
        logger.lifecycle("Generated ${outputFile}")
    }
}

tasks.register('verifyBootJarPackaging') {
    group = 'verification'
    description = 'Verifies the executable archive uses the renamed SubmIT entry point.'
    dependsOn tasks.named('bootJar')
    doLast {
        File archive = tasks.named('bootJar').get().archiveFile.get().asFile
        String applicationEntry = 'BOOT-INF/classes/ac/at/tgm/submit/SubmITlication.class'
        def verifyEntries = { List<String> entries, String startClass ->
            if (startClass != 'ac.at.tgm.submit.SubmITlication') {
                throw new GradleException("Unexpected executable archive Start-Class: ${startClass}")
            }
            if (entries.count { it == applicationEntry } != 1) {
                throw new GradleException("Expected exactly one ${applicationEntry} archive entry")
            }
            List<String> foreignClasses = entries.findAll {
                it.startsWith('BOOT-INF/classes/') && it.endsWith('.class')
                        && !it.startsWith('BOOT-INF/classes/ac/at/tgm/submit/')
            }
            if (!foreignClasses.isEmpty()) {
                throw new GradleException("Application classes outside ac.at.tgm.submit namespace: ${foreignClasses}")
            }
        }

        java.util.jar.JarFile jar = new java.util.jar.JarFile(archive)
        try {
            verifyEntries(Collections.list(jar.entries()).collect { it.name },
                    jar.manifest.mainAttributes.getValue('Start-Class'))
        } finally {
            jar.close()
        }

        File testDirectory = layout.buildDirectory.dir('tmp').get().asFile
        testDirectory.mkdirs()
        File testArchive = File.createTempFile('bootjar-foreign-namespace-', '.jar', testDirectory)
        try {
            java.util.jar.Manifest manifest = new java.util.jar.Manifest()
            manifest.mainAttributes.putValue('Manifest-Version', '1.0')
            manifest.mainAttributes.putValue('Start-Class', 'ac.at.tgm.submit.SubmITlication')
            new java.util.jar.JarOutputStream(new FileOutputStream(testArchive), manifest).withCloseable { output ->
                [applicationEntry, 'BOOT-INF/classes/org/example/Foreign.class'].each { name ->
                    output.putNextEntry(new java.util.jar.JarEntry(name))
                    output.write(0)
                    output.closeEntry()
                }
            }
            java.util.jar.JarFile injected = new java.util.jar.JarFile(testArchive)
            try {
                boolean rejected = false
                try {
                    verifyEntries(Collections.list(injected.entries()).collect { it.name },
                            injected.manifest.mainAttributes.getValue('Start-Class'))
                } catch (GradleException expected) {
                    rejected = true
                }
                if (!rejected) {
                    throw new GradleException('Packaging verification accepted an injected foreign-namespace class')
                }
            } finally {
                injected.close()
            }
        } finally {
            testArchive.delete()
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyBootJarPackaging')
}

tasks.named('test') {
    dependsOn tasks.named('verifyDeprecationEnforcement')
}

tasks.named('compileJava') {
    finalizedBy tasks.named('verifyDeprecationEnforcement')
}

tasks.named('compileTestJava') {
    finalizedBy tasks.named('verifyDeprecationEnforcement')
}
