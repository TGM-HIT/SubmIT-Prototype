components:
  schemas:
    Decision:
      type: object
      description: "Final grade decision: either a configured ruleId, or a manual\
        \ grade with an explicit rationale."
      properties:
        ruleId:
          type: string
          description: Configured aggregation rule; omit for a manual decision.
        grade:
          type: number
          description: Manual grade (required without ruleId); with ruleId it must
            equal the computed result.
        rationale:
          type: string
          description: Rationale; required when no configured rule is used.
          maxLength: 4000
          minLength: 0
    FinalGradesRequest:
      type: object
      description: Records project and/or individual final grades; earlier ones are
        retained as superseded.
      properties:
        rubricId:
          type: string
          format: uuid
        versionTransition:
          $ref: "#/components/schemas/VersionTransition"
        project:
          $ref: "#/components/schemas/Decision"
        students:
          type: array
          items:
            $ref: "#/components/schemas/StudentDecision"
      required:
      - rubricId
    StudentDecision:
      type: object
      description: Final grade decision for one student.
      properties:
        studentId:
          type: string
          format: uuid
        ruleId:
          type: string
        grade:
          type: number
        rationale:
          type: string
          maxLength: 4000
          minLength: 0
      required:
      - studentId
    VersionTransition:
      type: object
      description: "Explicit, recorded switch to another rubric version for a project\
        \ that is already bound."
      properties:
        reason:
          type: string
          description: Why the project moves to another rubric version.
          maxLength: 2000
          minLength: 0
      required:
      - reason
    FinalGradeResponse:
      type: object
      description: "Stored final grade with its method, rationale and input snapshot."
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        createdAt:
          type: string
        projectId:
          type: string
          format: uuid
        rubricId:
          type: string
          format: uuid
        rubricVersion:
          type: string
        scope:
          type: string
        studentId:
          type: string
          format: uuid
        grade:
          type: number
        method:
          type: string
        ruleId:
          type: string
        ruleVersion:
          type: integer
          format: int32
        rationale:
          type: string
        inputs:
          $ref: "#/components/schemas/Inputs"
        decidedBy:
          type: string
          format: uuid
        decidedAt:
          type: string
    FinalGradesResponse:
      type: object
      description: Result of recording final grades.
      properties:
        project:
          $ref: "#/components/schemas/FinalGradeResponse"
        students:
          type: array
          items:
            $ref: "#/components/schemas/FinalGradeResponse"
    GradeResponse:
      type: object
      description: Stored grade entry bound to an immutable rubric version and criterion.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        createdAt:
          type: string
        projectId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        rubricId:
          type: string
          format: uuid
        rubricVersion:
          type: string
        criterionId:
          type: string
        categoryId:
          type: string
        grade:
          type: number
        assessedOn:
          type: string
        evidence:
          type: string
        comments:
          type: string
        teacherId:
          type: string
          format: uuid
        recordedAt:
          type: string
        supersedesId:
          type: string
          format: uuid
        supersededById:
          type: string
          format: uuid
        reason:
          type: string
    Inputs:
      type: object
      description: Grades and observations that were considered when the final grade
