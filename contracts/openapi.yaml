  /api/artifacts/{artifactId}/publication-review:
    post:
      tags:
      - Project artefacts and archive
      summary: Submit an artefact for publication review or record a teacher decision.
      operationId: review_3
      parameters:
      - name: artifactId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
