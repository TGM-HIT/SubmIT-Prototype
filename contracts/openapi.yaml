          minLength: 0
        grade:
          type: number
        assessedOn:
          type: string
          pattern: "\\d{4}-\\d{2}-\\d{2}"
        evidence:
          type: string
          maxLength: 4000
          minLength: 0
        comments:
          type: string
          maxLength: 4000
          minLength: 0
