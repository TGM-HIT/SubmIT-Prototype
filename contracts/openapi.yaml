    AggregationRuleDto:
      type: object
      description: Explicitly configured weighted-average rule; no formula exists
        unless configured here.
      properties:
        id:
          type: string
          maxLength: 100
          minLength: 0
        version:
          type: integer
          format: int32
        scope:
          type: string
          minLength: 1
          pattern: STUDENT|PROJECT
        type:
          type: string
          minLength: 1
          pattern: WEIGHTED_AVERAGE
        decimals:
          type: integer
          format: int32
          description: Decimal places of the computed grade (0 to 6).
        criterionWeights:
          type: object
          additionalProperties:
            type: number
          description: Weight per criterion id.
        metricWeights:
          type: object
          additionalProperties:
            type: number
          description: Weight per metric id.
      required:
      - id
      - scope
      - type
      - version
    CategoryDto:
      type: object
      description: Rubric category grouping criteria.
      properties:
        id:
          type: string
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/CriterionDto"
          minItems: 1
      required:
      - criteria
      - id
      - name
    CriterionDto:
      type: object
      description: Assessable criterion of a rubric category.
      properties:
        id:
          type: string
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        subject:
          type: string
          description: "Who may be assessed: STUDENT, GROUP or BOTH."
          minLength: 1
          pattern: STUDENT|GROUP|BOTH
        stage:
          type: string
          description: Optional project stage the criterion belongs to.
          maxLength: 100
          minLength: 0
        evidenceRequired:
          type: boolean
          description: Whether a grade needs written evidence.
        scale:
          $ref: "#/components/schemas/ScaleDto"
      required:
      - id
      - name
      - scale
      - subject
    MetricDefinitionDto:
      type: object
      description: Versioned project metric definition with optional bounds.
      properties:
        id:
          type: string
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        version:
          type: integer
          format: int32
        description:
          type: string
          maxLength: 2000
          minLength: 0
        unit:
          type: string
          maxLength: 50
          minLength: 0
        min:
          type: number
        max:
          type: number
      required:
      - id
      - name
      - version
    PublishRubricRequest:
      type: object
      description: Request to publish a new immutable rubric version.
      properties:
        version:
          type: string
          description: Unique version label.
          example: 2026-1
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        schoolYear:
          type: string
          maxLength: 50
          minLength: 0
        effectiveFrom:
          type: string
          example: 2026-09-01
          minLength: 1
          pattern: "\\d{4}-\\d{2}-\\d{2}"
        effectiveTo:
          type: string
          pattern: "\\d{4}-\\d{2}-\\d{2}"
        finalGradeScale:
          $ref: "#/components/schemas/ScaleDto"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryDto"
          minItems: 1
        metricDefinitions:
          type: array
          items:
            $ref: "#/components/schemas/MetricDefinitionDto"
        aggregationRules:
          type: array
          items:
            $ref: "#/components/schemas/AggregationRuleDto"
      required:
      - categories
      - effectiveFrom
      - finalGradeScale
      - name
      - version
    ScaleDto:
      type: object
      description: Configured numeric scale; values must lie within min and max and
        be a multiple of step from min.
      properties:
        min:
          type: number
          description: Lowest value.
        max:
          type: number
          description: Highest value.
        step:
          type: number
          description: Step size from min; defaults to 1.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Optional display label per scale value.
      required:
      - max
      - min
