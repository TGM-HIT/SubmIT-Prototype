      operationId: review
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponse"
  /api/ideas/{id}/reviews:
    post:
      tags:
      - idea-review-controller
      operationId: review_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaReviewRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponse"
  /api/grading-rubrics:
    get:
      tags:
      - Grading rubrics
      summary: List rubric versions and their effective periods.
      operationId: list_2
      parameters:
      - name: page
        in: query
        description: Zero-based page index.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: "Page size, at most 100."
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Paginated rubric version summaries.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseRubricSummary"
    post:
      tags:
      - Grading rubrics
      summary: Publish a new immutable rubric version (ADMIN only).
      operationId: publish
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRubricRequest"
        required: true
      responses:
        "400":
          description: "Invalid rubric structure, scale, metric, or rule."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RubricResponse"
        "403":
          description: Caller is not an administrator.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RubricResponse"
        "409":
          description: The rubric version label already exists.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RubricResponse"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RubricResponse"
  /api/formal-applications/{id}/submit:
    post:
      tags:
