openapi: 3.1.0
info:
  title: Project Ideas API
  version: 1.0.0
servers:
- url: http://127.0.0.1:19034
  description: Generated server url
security:
- bearerAuth: []
paths:
  /api/projects/{projectId}/final-grade:
    get:
      tags:
      - Final grades
      summary: "Get the current final project grade, its basis, and history."
      operationId: getFinalGrade
      parameters:
      - name: projectId
        in: path
        description: Project identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: No final grade has been recorded.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FinalGradeHistory"
    put:
      tags:
      - Final grades
      summary: "Record or confirm project and individual final grades, by configured\
        \ rule or with rationale."
      operationId: putFinalGrade
      parameters:
      - name: projectId
        in: path
        description: Project identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalGradesRequest"
        required: true
      responses:
        "400":
          description: "Invalid grade, missing rationale, or unknown rule."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FinalGradesResponse"
        "409":
          description: A configured rule lacks required inputs.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FinalGradesResponse"
  /api/ideas/{id}:
    get:
      tags:
      - Ideas and reviews
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IdeaResponse"
    put:
      tags:
      - Ideas and reviews
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IdeaResponse"
  /api/ideas/{id}/supervisor:
    put:
      tags:
      - idea-review-controller
      operationId: assignSupervisor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupervisorRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupervisorResponse"
  /api/ideas/{id}/supervision-preference:
    put:
      tags:
      - idea-review-controller
      operationId: setSupervisionPreference
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupervisionPreferenceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupervisionPreferenceResponse"
  /api/ideas/{id}/specification:
    put:
      tags:
      - specification-controller
      summary: Save a full specification after teacher approval of the idea.
      operationId: save
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecificationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SpecificationResponse"
  /api/formal-applications/{id}:
    put:
      tags:
      - Formal project applications
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormalApplicationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FormalApplicationResponse"
  /api/applications/{id}:
    put:
      tags:
      - student-application-controller
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentApplicationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StudentApplicationResponse"
    delete:
      tags:
      - student-application-controller
      operationId: withdraw
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/application-periods/{id}:
    get:
      tags:
      - School years and applications
      operationId: getPeriod
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApplicationPeriodResponse"
    put:
      tags:
      - School years and applications
      operationId: updatePeriod
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationPeriodRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApplicationPeriodResponse"
  /api/projects/{projectId}/student-grades:
    get:
      tags:
      - Student grades
      summary: List individual grade history; students see only their own grades.
      operationId: listStudentGrades
      parameters:
      - name: projectId
        in: path
        description: Project identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: studentId
        in: query
        description: Optional student filter.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: "Page size, at most 100."
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "403":
          description: Caller lacks the required role or project access.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGradeResponse"
    post:
      tags:
      - Student grades
      summary: Record a teacher's assessment of one student against one rubric criterion.
      operationId: recordStudentGrade
      parameters:
      - name: projectId
        in: path
        description: Project identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentGradeRequest"
        required: true
      responses:
        "400":
          description: Grade outside the criterion scale or invalid input.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GradeResponse"
        "403":
          description: Caller lacks the required role or project access.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GradeResponse"
        "409":
          description: Rubric version differs from the project's bound version.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GradeResponse"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GradeResponse"
  /api/projects/{projectId}/student-grades/{gradeId}/revisions:
    post:
      tags:
      - Student grade revisions
      summary: Record a correction or reassessment; the prior entry is retained as
        superseded.
      operationId: reviseStudentGrade
      parameters:
      - name: projectId
        in: path
        description: Project identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: gradeId
        in: path
        description: Grade entry to revise.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeRevisionRequest"
        required: true
      responses:
        "409":
          description: The entry has already been superseded.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GradeResponse"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GradeResponse"
  /api/projects/{projectId}/metrics:
    get:
      tags:
      - Project metrics
      summary: List metric observations for teachers and project members.
      operationId: listMetrics
      parameters:
      - name: projectId
        in: path
        description: Project identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page index.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: "Page size, at most 100."
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "403":
          description: Caller lacks the required role or project access.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseMetricResponse"
    post:
      tags:
      - Project metrics
      summary: Record a metric observation validated against the configured metric
        definition.
      operationId: recordMetric
      parameters:
      - name: projectId
        in: path
        description: Project identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricRequest"
        required: true
      responses:
        "403":
          description: Caller lacks the required role or project access.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetricResponse"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetricResponse"
  /api/projects/{projectId}/group-grades:
    get:
      tags:
      - Group grades
      summary: List group-level assessment history for teachers and group members.
      operationId: listGroupGrades
      parameters:
      - name: projectId
        in: path
        description: Project identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page index.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: "Page size, at most 100."
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "403":
          description: Caller lacks the required role or project access.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGradeResponse"
    post:
      tags:
      - Group grades
      summary: Record a teacher's assessment for a group-level rubric criterion.
      operationId: recordGroupGrade
      parameters:
      - name: projectId
        in: path
        description: Project identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupGradeRequest"
        required: true
      responses:
        "403":
          description: Caller lacks the required role or project access.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GradeResponse"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GradeResponse"
  /api/projects/{projectId}/formal-applications:
    get:
      tags:
      - Formal project applications
      operationId: get_1
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FormalApplicationResponse"
    post:
      tags:
      - Formal project applications
      summary: Create a draft formal application for an allocated group.
      description: Text limits count Java UTF-16 code units; the service also enforces
        combined per-student field limits.
      operationId: create
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormalApplicationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FormalApplicationResponse"
  /api/projects/{projectId}/complete:
    post:
      tags:
      - Project artefacts and archive
      summary: Mark a project complete after final grading and all required artefact
        types are present.
      operationId: complete
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompletionResponse"
  /api/projects/{projectId}/artifacts:
    get:
      tags:
      - Project artefacts and archive
      summary: List paginated project artefacts visible to the caller.
      operationId: list
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseArtifactResponse"
    post:
      tags:
      - Project artefacts and archive
      summary: Upload a private project artefact; uploads never publish automatically.
      operationId: upload
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ArtifactUploadRequest"
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
  /api/ideas:
    get:
      tags:
      - Ideas and reviews
      operationId: list_1
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseIdeaResponse"
    post:
      tags:
      - Ideas and reviews
      summary: Create an idea draft for the authenticated student.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IdeaResponse"
  /api/ideas/{id}/withdraw:
    post:
