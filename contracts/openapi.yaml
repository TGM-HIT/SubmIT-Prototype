            '*/*':
              schema:
                $ref: "#/components/schemas/FormalReviewResponse"
  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a student account. Any supplied role is ignored.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
      security: []
  /api/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate and receive a signed bearer token.
      operationId: login
      requestBody:
        content:
