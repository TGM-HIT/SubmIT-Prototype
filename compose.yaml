# Build, test and run the complete application after replacing the local-only
# database and pgAdmin credential placeholders in .env:
#   cp .env.example .env && ./scripts/compose.sh up --build
# Tests, typecheck and checkstyle run as part of the image builds.
services:
  database:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DADB_BOOTSTRAPADMIN_USERNAME: ${DADB_BOOTSTRAPADMIN_USERNAME}
      DADB_BOOTSTRAPADMIN_PASSWORD: ${DADB_BOOTSTRAPADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.19
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:?Set PGADMIN_PORT in .env}:80"
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/submit-pgadmin-entrypoint.sh"]
    volumes:
      - ./scripts/pgadmin-entrypoint.sh:/usr/local/bin/submit-pgadmin-entrypoint.sh:ro
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    ports:
      - "${DADB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
